# 兜底方案：在 ECS 上直接构建（完全不依赖 ACR 和跨境网络）
#
# 什么时候用：GitHub Actions 推送到阿里云 ACR 一直 403 时。
# 用法（服务器 /opt/app 已是本项目源码）：
#   cd /opt/app
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 说明：
# - 后端用阿里云 PyPI 源，避免从国内访问 pypi.org 超时
# - ./chroma-model 是 chromadb 默认向量模型（all-MiniLM-L6-v2），
#   提前放进来后容器启动无需联网下载模型，RAG 才能稳定工作
services:
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: amiko-backend:local
    volumes:
      - ./chroma-model:/root/.cache/chroma/onnx_models:ro

  frontend:
    build:
      context: ./frontend
    image: amiko-frontend:local
