name: Build and Deploy to Aliyun ECS

on:
  push:
    branches: [ main ] # 当你推送到 main 分支时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Diagnose DNS resolution
        run: |
          echo "Checking DNS for ${{ secrets.ACR_REGISTRY }}"
          nslookup ${{ secrets.ACR_REGISTRY }} || true
          ping -c 2 ${{ secrets.ACR_REGISTRY }} || true
          
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Backend
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/amiko-project/backend:latest ./backend
          docker push ${{ secrets.ACR_REGISTRY }}/amiko-project/backend:latest

      - name: Build and push Frontend
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/amiko-project/frontend:latest ./frontend
          docker push ${{ secrets.ACR_REGISTRY }}/amiko-project/frontend:latest

      - name: Deploy on ECS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          # 加入这一行，把密码传进服务器
          envs: ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            # 使用传进来的环境变量登录
            echo "$ACR_PASSWORD" | docker login $ACR_REGISTRY -u "$ACR_USERNAME" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
