name: Build and Deploy to Aliyun ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 👇 把环境变量声明放在 Job 层面，所有步骤都能用
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ACR, Build and Push (Pure Shell)
        run: |
          echo "Registry length is: ${#ACR_REGISTRY}"
          
          # 👇 关键一步：强行把域名绑定到查到的 IP（记得把 8.8.8.8 换成你刚才查到的真实 IP！）
          echo "114.114.114.114 $ACR_REGISTRY" | sudo tee -a /etc/hosts
          
          # 验证一下 hosts 是否生效
          ping -c 2 $ACR_REGISTRY

          # 开始登录并推送
          echo "$ACR_PASSWORD" | docker login $ACR_REGISTRY -u "$ACR_USERNAME" --password-stdin
          
          # 构建后端
          docker build -t $ACR_REGISTRY/amiko-project/backend:latest ./backend
          docker push $ACR_REGISTRY/amiko-project/backend:latest
          
          # 构建前端
          docker build -t $ACR_REGISTRY/amiko-project/frontend:latest ./frontend
          docker push $ACR_REGISTRY/amiko-project/frontend:latest

      - name: Deploy on ECS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          # 传变量给服务器
          envs: ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "$ACR_PASSWORD" | docker login $ACR_REGISTRY -u "$ACR_USERNAME" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
