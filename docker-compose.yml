services:
  backend:
    # 注意这里用了带 -vpc 的地址
    image: cri-3djr1rhtcfvq0io6-vpc.cn-beijing.personal.cr.aliyuncs.com/amiko-project/backend:latest
    container_name: my_backend
    restart: always
    env_file:
      - .env
    expose:
      - "8000"

  frontend:
    # 注意这里用了带 -vpc 的地址
    image: cri-3djr1rhtcfvq0io6-vpc.cn-beijing.personal.cr.aliyuncs.com/amiko-project/frontend:latest
    container_name: my_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend