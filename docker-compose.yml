services:
  backend:
    image: registry.cn-beijing.aliyuncs.com/amiko-project/backend:latest
    container_name: my_backend
    restart: always
    env_file:
      - .env
    expose:
      - "8000"

  frontend:
    image: registry.cn-beijing.aliyuncs.com/amiko-project/frontend:latest
    container_name: my_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend